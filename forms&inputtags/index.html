<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms and input teg - lets learn</title>
  </head>
  <body>
    <h1>form to apply for web-TA</h1>
    <form action="post">
      <div>
        <label for="user name">enter your name:</label>
        <input
          type="text"
          id="username"
          name="user name"
          placeholder="enter your user name"
          autofocus
        />
      </div>
      <div>
        <label for="for gender">enter your gender:</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">female</label>
      </div>
      <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes" />
        <label for="subscribe">subscribe</label>
      </div>
      <div>
        <label for="comment">enter your comment:</label>
        <br />
        <textarea
          name="comment"
          rows="5"
          cols="50"
          placeholder="enter your comment..."
          autofocus
        ></textarea>
      </div>
      <div>
        <select name="course">
          <option value="B.C.A">B.C.A</option>
          <option value="B.C.A">B.tech</option>
          <option value="B.C.A">B.SC</option>
          <option value="B.com">B.Com</option>
          <option value="M.C.A">M.C.A</option>
        </select>
      </div>
    </form>
  </body>
</html>
